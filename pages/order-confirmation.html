<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="BazaarHub order confirmation"
    >

    <title>Order Confirmed | BazaarHub</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .header {
            background: #111827;
            padding: 18px 5%;
        }

        .header a {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: 700;
        }

        .container {
            width: 92%;
            max-width: 800px;
            margin: 40px auto;
        }

        .success-card {
            background: white;
            border-radius: 16px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .success-icon {
            width: 85px;
            height: 85px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #dcfce7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        h1 {
            color: #15803d;
            margin-bottom: 10px;
        }

        .message {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .order-id {
            background: #f3f4f6;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .order-id span {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .order-id strong {
            font-size: 18px;
            color: #111827;
        }

        .details {
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .details h2 {
            font-size: 19px;
            margin-bottom: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 9px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-row span:first-child {
            color: #777;
        }

        .detail-row span:last-child {
            font-weight: 600;
            text-align: right;
        }

        .items {
            margin-top: 20px;
            text-align: left;
        }

        .items h2 {
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .item-name {
            font-weight: 600;
        }

        .item-quantity {
            color: #777;
            font-size: 13px;
            margin-top: 4px;
        }

        .item-price {
            font-weight: 700;
            white-space: nowrap;
        }

        .total {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 2px solid #ddd;
            font-size: 20px;
            font-weight: 700;
        }

        .cod {
            margin-top: 20px;
            padding: 14px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 10px;
            color: #9a3412;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 700;
            text-align: center;
        }

        .shop-btn {
            background: #111827;
            color: white;
        }

        .orders-btn {
            background: #e5e7eb;
            color: #111827;
        }

        .error {
            text-align: center;
            padding: 40px 20px;
        }

        @media (max-width: 550px) {

            .container {
                margin-top: 20px;
            }

            .success-card {
                padding: 28px 18px;
            }

            .buttons {
                flex-direction: column;
            }

            .detail-row {
                flex-direction: column;
                gap: 4px;
            }

            .detail-row span:last-child {
                text-align: left;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <a href="../index.html">
        🛍️ BazaarHub
    </a>

</header>


<main class="container">

    <div id="confirmation"></div>

</main>


<script>


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value) {

    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


// =====================================================
// MONEY FORMAT
// =====================================================

function money(value) {

    return Number(value || 0)
        .toLocaleString('en-IN');

}


// =====================================================
// GENERATE ORDER ID
// =====================================================

function generateOrderId() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(now.getMonth() + 1)
            .padStart(2, '0');

    const day =
        String(now.getDate())
            .padStart(2, '0');

    const random =
        Math.floor(
            1000 + Math.random() * 9000
        );

    return `BH-${year}${month}${day}-${random}`;

}


// =====================================================
// GET LATEST ORDER
// =====================================================

function getLatestOrder() {

    let order = null;

    // -------------------------------------------------
    // First try all orders
    // -------------------------------------------------

    try {

        const savedOrders =
            localStorage.getItem(
                'bazaarhubOrders'
            );

        if (savedOrders) {

            const orders =
                JSON.parse(savedOrders);

            if (
                Array.isArray(orders) &&
                orders.length > 0
            ) {

                // Find latest order using createdAt
                const sortedOrders =
                    [...orders].sort(
                        function(a, b) {

                            const dateA =
                                new Date(
                                    a.createdAt || 0
                                ).getTime();

                            const dateB =
                                new Date(
                                    b.createdAt || 0
                                ).getTime();

                            return dateB - dateA;

                        }
                    );

                order =
                    sortedOrders[0];

            }

        }

    } catch (error) {

        console.error(
            'Unable to load orders:',
            error
        );

    }


    // -------------------------------------------------
    // Fallback to latest single order
    // -------------------------------------------------

    if (!order) {

        try {

            const savedOrder =
                localStorage.getItem(
                    'bazaarhubOrder'
                );

            if (savedOrder) {

                order =
                    JSON.parse(savedOrder);

            }

        } catch (error) {

            console.error(
                'Unable to load latest order:',
                error
            );

        }

    }


    return order;

}


// =====================================================
// SAVE REPAIRED ORDER
// =====================================================

function saveOrder(order) {

    try {

        // Save latest order
        localStorage.setItem(
            'bazaarhubOrder',
            JSON.stringify(order)
        );


        // Save inside all orders
        let orders = [];

        const savedOrders =
            localStorage.getItem(
                'bazaarhubOrders'
            );

        if (savedOrders) {

            try {

                const parsed =
                    JSON.parse(savedOrders);

                if (Array.isArray(parsed)) {

                    orders = parsed;

                }

            } catch (error) {

                orders = [];

            }

        }


        // Find same order
        const index =
            orders.findIndex(
                function(item) {

                    return (
                        item.id === order.id
                    );

                }
            );


        if (index >= 0) {

            orders[index] = order;

        } else {

            orders.push(order);

        }


        localStorage.setItem(
            'bazaarhubOrders',
            JSON.stringify(orders)
        );

    } catch (error) {

        console.error(
            'Unable to save order:',
            error
        );

    }

}


// =====================================================
// LOAD CONFIRMATION
// =====================================================

function loadConfirmation() {

    const container =
        document.getElementById(
            'confirmation'
        );


    let order =
        getLatestOrder();


    // -------------------------------------------------
    // No order
    // -------------------------------------------------

    if (!order) {

        container.innerHTML = `

            <div class="success-card error">

                <div class="success-icon">
                    🛒
                </div>

                <h1>
                    No Order Found
                </h1>

                <p class="message">
                    We could not find your latest order.
                </p>

                <a
                    href="../index.html"
                    class="btn shop-btn"
                >
                    Continue Shopping
                </a>

            </div>

        `;

        return;

    }


    // -------------------------------------------------
    // Make sure customer exists
    // -------------------------------------------------

    order.customer =
        order.customer || {};


    // -------------------------------------------------
    // Generate missing Order ID
    // -------------------------------------------------

    if (
        !order.id ||
        order.id === 'ORD-UNKNOWN'
    ) {

        order.id =
            generateOrderId();

    }


    // -------------------------------------------------
    // Generate missing order date
    // -------------------------------------------------

    if (!order.createdAt) {

        order.createdAt =
            new Date().toISOString();

    }


    // -------------------------------------------------
    // Save repaired order
    // -------------------------------------------------

    saveOrder(order);


    // -------------------------------------------------
    // Customer
    // -------------------------------------------------

    const customer =
        order.customer;


    // -------------------------------------------------
    // Items
    // -------------------------------------------------

    const items =
        Array.isArray(order.items)
            ? order.items
            : [];


    // -------------------------------------------------
    // Total
    // -------------------------------------------------

    const total =
        Number(order.total) || 0;


    // -------------------------------------------------
    // Date
    // -------------------------------------------------

    let orderDate =
        'N/A';

    const date =
        new Date(
            order.createdAt
        );

    if (!isNaN(date.getTime())) {

        orderDate =
            date.toLocaleString(
                'en-IN'
            );

    }


    // =================================================
    // ITEMS HTML
    // =================================================

    const itemsHTML =

        items.length > 0

        ?

        items.map(
            function(item) {

                const name =
                    item.title ||
                    item.name ||
                    'Product';


                const quantity =
                    Number(
                        item.quantity
                    ) || 1;


                const price =
                    Number(
                        item.price
                    ) || 0;


                const itemTotal =
                    price * quantity;


                return `

                    <div class="item">

                        <div>

                            <div class="item-name">
                                ${escapeHTML(name)}
                            </div>

                            <div class="item-quantity">
                                Quantity: ${quantity}
                            </div>

                        </div>

                        <div class="item-price">
                            ₹${money(itemTotal)}
                        </div>

                    </div>

                `;

            }
        ).join('')

        :

        `

            <p style="color:#777;">
                No product details available.
            </p>

        `;


    // =================================================
    // DISPLAY
    // =================================================

    container.innerHTML = `

        <div class="success-card">

            <div class="success-icon">
                ✓
            </div>


            <h1>
                Order Placed Successfully!
            </h1>


            <p class="message">
                Thank you for shopping with BazaarHub.
                Your order has been received.
            </p>


            <div class="order-id">

                <span>
                    Order ID
                </span>

                <strong>
                    ${escapeHTML(order.id)}
                </strong>

            </div>


            <div class="details">

                <h2>
                    📦 Delivery Details
                </h2>


                <div class="detail-row">

                    <span>
                        Name
                    </span>

                    <span>
                        ${escapeHTML(
                            customer.name ||
                            'Nothing'
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span>
                        Mobile
                    </span>

                    <span>
                        ${escapeHTML(
                            customer.phone ||
                            'Nothing'
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span>
                        Address
                    </span>

                    <span>
                        ${escapeHTML(
                            customer.address ||
                            'Nothing'
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span>
                        City
                    </span>

                    <span>
                        ${escapeHTML(
                            customer.city ||
                            'Nothing'
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span>
                        State
                    </span>

                    <span>
                        ${escapeHTML(
                            customer.state ||
                            'Nothing'
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span>
                        Pincode
                    </span>

                    <span>
                        ${escapeHTML(
                            customer.pincode ||
                            'Nothing'
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span>
                        Order Date
                    </span>

                    <span>
                        ${escapeHTML(orderDate)}
                    </span>

                </div>

            </div>


            <div class="items">

                <h2>
                    🛒 Ordered Products
                </h2>

                ${itemsHTML}

            </div>


            <div class="total">

                <span>
                    Total
                </span>

                <span>
                    ₹${money(total)}
                </span>

            </div>


            <div class="cod">
                💵 Payment: Cash on Delivery
            </div>


            <div class="buttons">

                <a
                    href="../index.html"
                    class="btn shop-btn"
                >
                    Continue Shopping
                </a>


                <a
                    href="orders.html"
                    class="btn orders-btn"
                >
                    📋 My Orders
                </a>

            </div>

        </div>

    `;

}


// =====================================================
// START
// =====================================================

document.addEventListener(
    'DOMContentLoaded',
    loadConfirmation
);

</script>


</body>

    </html>
