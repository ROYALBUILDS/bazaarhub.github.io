<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="BazaarHub order confirmation"
    >

    <title>Order Confirmed | BazaarHub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .header {
            background: #111827;
            padding: 18px 5%;
        }

        .header a {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: 700;
        }

        .container {
            width: 92%;
            max-width: 800px;
            margin: 40px auto;
        }

        .success-card {
            background: white;
            border-radius: 16px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .success-icon {
            width: 85px;
            height: 85px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #dcfce7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        h1 {
            color: #15803d;
            margin-bottom: 10px;
        }

        .message {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .order-id {
            background: #f3f4f6;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .order-id span {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .order-id strong {
            font-size: 18px;
            color: #111827;
        }

        .details {
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .details h2 {
            font-size: 19px;
            margin-bottom: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 9px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-row span:first-child {
            color: #777;
        }

        .detail-row span:last-child {
            font-weight: 600;
            text-align: right;
        }

        .items {
            margin-top: 20px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .item-name {
            font-weight: 600;
        }

        .item-quantity {
            color: #777;
            font-size: 13px;
            margin-top: 4px;
        }

        .item-price {
            font-weight: 700;
        }

        .total {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 2px solid #ddd;
            font-size: 20px;
            font-weight: 700;
        }

        .cod {
            margin-top: 20px;
            padding: 14px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 10px;
            color: #9a3412;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 700;
            text-align: center;
        }

        .shop-btn {
            background: #111827;
            color: white;
        }

        .orders-btn {
            background: #e5e7eb;
            color: #111827;
        }

        .error {
            text-align: center;
            padding: 40px 20px;
        }

        @media (max-width: 550px) {

            .container {
                margin-top: 20px;
            }

            .success-card {
                padding: 28px 18px;
            }

            .buttons {
                flex-direction: column;
            }

            .detail-row {
                flex-direction: column;
                gap: 4px;
            }

            .detail-row span:last-child {
                text-align: left;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <a href="../index.html">
        🛍️ BazaarHub
    </a>
</header>

<main class="container">

    <div id="confirmation"></div>

</main>


<script>

    function escapeHTML(value) {

        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

    }


    function money(value) {

        return Number(value || 0)
            .toLocaleString('en-IN');

    }


    function loadConfirmation() {

        const savedOrder =
            localStorage.getItem(
                'bazaarhubOrder'
            );

        const container =
            document.getElementById(
                'confirmation'
            );


        if (!savedOrder) {

            container.innerHTML = `

                <div class="success-card error">

                    <div class="success-icon">
                        🛒
                    </div>

                    <h1>
                        No Order Found
                    </h1>

                    <p class="message">
                        We could not find your latest order.
                    </p>

                    <a
                        href="../index.html"
                        class="btn shop-btn"
                    >
                        Continue Shopping
                    </a>

                </div>

            `;

            return;
        }


        let order;

        try {

            order =
                JSON.parse(savedOrder);

        } catch (error) {

            container.innerHTML = `

                <div class="success-card error">

                    <h1>
                        Something went wrong
                    </h1>

                    <p class="message">
                        Unable to load your order.
                    </p>

                    <a
                        href="../index.html"
                        class="btn shop-btn"
                    >
                        Back to Shop
                    </a>

                </div>

            `;

            return;
        }


        const customer =
            order.customer || {};

        const items =
            Array.isArray(order.items)
                ? order.items
                : [];


        const total =
            Number(order.total) || 0;


        const orderDate =
            order.createdAt
                ? new Date(order.createdAt)
                    .toLocaleString('en-IN')
                : 'N/A';


        const itemsHTML =
            items.map(item => {

                const name =
                    item.title ||
                    item.name ||
                    'Product';

                const quantity =
                    Number(item.quantity) || 1;

                const price =
                    Number(item.price) || 0;

                return `

                    <div class="item">

                        <div>

                            <div class="item-name">
                                ${escapeHTML(name)}
                            </div>

                            <div class="item-quantity">
                                Quantity: ${quantity}
                            </div>

                        </div>

                        <div class="item-price">
                            ₹${money(price * quantity)}
                        </div>

                    </div>

                `;

            }).join('');


        container.innerHTML = `

            <div class="success-card">

                <div class="success-icon">
                    ✓
                </div>

                <h1>
                    Order Placed Successfully!
                </h1>

                <p class="message">
                    Thank you for shopping with BazaarHub.
                    Your order has been received.
                </p>


                <div class="order-id">

                    <span>
                        Order ID
                    </span>

                    <strong>
                        ${escapeHTML(order.id || 'ORD-UNKNOWN')}
                    </strong>

                </div>


                <div class="details">

                    <h2>
                        📦 Delivery Details
                    </h2>

                    <div class="detail-row">

                        <span>
                            Name
                        </span>

                        <span>
                            ${escapeHTML(customer.name || '')}
                        </span>

                    </div>

                    <div class="detail-row">

                        <span>
                            Mobile
                        </span>

                        <span>
                            ${escapeHTML(customer.phone || '')}
                        </span>

                    </div>

                    <div class="detail-row">

                        <span>
                            Address
                        </span>

                        <span>
                            ${escapeHTML(customer.address || '')}
                        </span>

                    </div>

                    <div class="detail-row">

                        <span>
                            City
                        </span>

                        <span>
                            ${escapeHTML(customer.city || '')}
                        </span>

                    </div>

                    <div class="detail-row">

                        <span>
                            State
                        </span>

                        <span>
                            ${escapeHTML(customer.state || '')}
                        </span>

                    </div>

                    <div class="detail-row">

                        <span>
                            Pincode
                        </span>

                        <span>
                            ${escapeHTML(customer.pincode || '')}
                        </span>

                    </div>

                    <div class="detail-row">

                        <span>
                            Order Date
                        </span>

                        <span>
                            ${escapeHTML(orderDate)}
                        </span>

                    </div>

                </div>


                <div class="items">

                    <h2 style="margin-top:25px;">
                        🛒 Ordered Products
                    </h2>

                    ${itemsHTML}

                </div>


                <div class="total">

                    <span>
                        Total
                    </span>

                    <span>
                        ₹${money(total)}
                    </span>

                </div>


                <div class="cod">
                    💵 Payment: Cash on Delivery
                </div>


                <div class="buttons">

                    <a
                        href="../index.html"
                        class="btn shop-btn"
                    >
                        Continue Shopping
                    </a>

                    <a
                        href="orders.html"
                        class="btn orders-btn"
                    >
                        📋 My Orders
                    </a>

                </div>

            </div>

        `;

    }


    document.addEventListener(
        'DOMContentLoaded',
        loadConfirmation
    );

</script>

</body>
</html>
