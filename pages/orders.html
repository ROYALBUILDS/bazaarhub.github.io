
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="BazaarHub - My Orders"
    >

    <title>My Orders | BazaarHub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .header {
            background: #111827;
            padding: 18px 5%;
        }

        .header a {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: 700;
        }

        .container {
            width: 92%;
            max-width: 1000px;
            margin: 35px auto;
        }

        .page-title {
            font-size: 30px;
            margin-bottom: 25px;
            color: #111827;
        }

        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .order-card {
            background: white;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .order-id {
            font-size: 17px;
            font-weight: 700;
            color: #111827;
        }

        .order-date {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        .status {
            background: #fff7ed;
            color: #c2410c;
            border: 1px solid #fed7aa;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .customer {
            padding: 16px 0;
            border-bottom: 1px solid #eee;
        }

        .customer h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #111827;
        }

        .customer p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .items {
            padding-top: 15px;
        }

        .items h3 {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: 600;
        }

        .item-quantity {
            color: #777;
            font-size: 13px;
            margin-top: 4px;
        }

        .item-price {
            font-weight: 700;
            white-space: nowrap;
        }

        .order-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #eee;
        }

        .payment {
            color: #9a3412;
            font-size: 14px;
            font-weight: 600;
        }

        .total {
            font-size: 20px;
            font-weight: 700;
            color: #111827;
        }

        .empty {
            background: white;
            border-radius: 14px;
            padding: 55px 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .empty-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .empty h2 {
            margin-bottom: 10px;
            color: #111827;
        }

        .empty p {
            color: #777;
            margin-bottom: 22px;
        }

        .shop-btn {
            display: inline-block;
            padding: 13px 22px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-weight: 700;
        }

        .shop-btn:hover {
            background: #000;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #111827;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {

            .container {
                width: 94%;
                margin: 20px auto;
            }

            .page-title {
                font-size: 25px;
            }

            .order-card {
                padding: 18px;
            }

            .order-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .status {
                align-self: flex-start;
            }

            .order-bottom {
                flex-direction: column;
                align-items: flex-start;
            }

            .total {
                font-size: 19px;
            }

            .item {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <a href="../index.html">
        🛍️ BazaarHub
    </a>
</header>


<main class="container">

    <a
        href="../index.html"
        class="back-link"
    >
        ← Continue Shopping
    </a>

    <h1 class="page-title">
        📋 My Orders
    </h1>

    <div id="ordersContainer"></div>

</main>


<script>

    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHTML(value) {

        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

    }


    // =====================================================
    // FORMAT MONEY
    // =====================================================

    function money(value) {

        return Number(value || 0)
            .toLocaleString('en-IN');

    }


    // =====================================================
    // LOAD ORDERS
    // =====================================================

    function loadOrders() {

        const container =
            document.getElementById(
                'ordersContainer'
            );


        let orders = [];


        // -------------------------------------------------
        // Get all orders
        // -------------------------------------------------

        try {

            const savedOrders =
                localStorage.getItem(
                    'bazaarhubOrders'
                );


            if (savedOrders) {

                const parsed =
                    JSON.parse(savedOrders);


                if (Array.isArray(parsed)) {

                    orders = parsed;

                }

            }

        } catch (error) {

            console.error(
                'Unable to load orders:',
                error
            );

        }


        // -------------------------------------------------
        // Fallback to latest order
        // -------------------------------------------------

        if (orders.length === 0) {

            try {

                const latestOrder =
                    localStorage.getItem(
                        'bazaarhubOrder'
                    );


                if (latestOrder) {

                    const parsedOrder =
                        JSON.parse(latestOrder);


                    if (parsedOrder) {

                        orders = [
                            parsedOrder
                        ];

                    }

                }

            } catch (error) {

                console.error(
                    'Unable to load latest order:',
                    error
                );

            }

        }


        // -------------------------------------------------
        // No orders
        // -------------------------------------------------

        if (orders.length === 0) {

            container.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        📦
                    </div>

                    <h2>
                        No Orders Yet
                    </h2>

                    <p>
                        You haven't placed any orders yet.
                    </p>

                    <a
                        href="../index.html"
                        class="shop-btn"
                    >
                        Start Shopping
                    </a>

                </div>

            `;

            return;

        }


        // -------------------------------------------------
        // Show newest order first
        // -------------------------------------------------

        orders.sort(
            function(a, b) {

                const dateA =
                    new Date(
                        a.createdAt || 0
                    ).getTime();

                const dateB =
                    new Date(
                        b.createdAt || 0
                    ).getTime();

                return dateB - dateA;

            }
        );


        // -------------------------------------------------
        // Render orders
        // -------------------------------------------------

        container.innerHTML =
            `<div class="orders-list">

                ${
                    orders.map(
                        function(order) {

                            return renderOrder(
                                order
                            );

                        }
                    ).join('')
                }

            </div>`;

    }


    // =====================================================
    // RENDER ONE ORDER
    // =====================================================

    function renderOrder(order) {

        const customer =
            order.customer || {};


        const items =
            Array.isArray(order.items)
                ? order.items
                : [];


        const orderId =
            order.id ||
            'ORD-UNKNOWN';


        const status =
            order.status ||
            'pending';


        let orderDate = 'N/A';


        if (order.createdAt) {

            const date =
                new Date(
                    order.createdAt
                );


            if (!isNaN(date.getTime())) {

                orderDate =
                    date.toLocaleString(
                        'en-IN'
                    );

            }

        }


        const total =
            Number(order.total) || 0;


        // -------------------------------------------------
        // Customer address
        // -------------------------------------------------

        const addressParts = [

            customer.address,

            customer.city,

            customer.state,

            customer.pincode

        ].filter(Boolean);


        const address =
            addressParts.join(', ');


        // -------------------------------------------------
        // Items
        // -------------------------------------------------

        const itemsHTML =

            items.length > 0

                ?

                items.map(
                    function(item) {

                        const name =
                            item.title ||
                            item.name ||
                            'Product';


                        const quantity =
                            Number(
                                item.quantity
                            ) || 1;


                        const price =
                            Number(
                                item.price
                            ) || 0;


                        const itemTotal =
                            price * quantity;


                        return `

                            <div class="item">

                                <div>

                                    <div class="item-name">
                                        ${escapeHTML(name)}
                                    </div>

                                    <div class="item-quantity">
                                        Quantity: ${quantity}
                                    </div>

                                </div>

                                <div class="item-price">
                                    ₹${money(itemTotal)}
                                </div>

                            </div>

                        `;

                    }
                ).join('')

                :

                `

                    <p style="color:#777;">
                        No product details available.
                    </p>

                `;


        // -------------------------------------------------
        // Order card
        // -------------------------------------------------

        return `

            <article class="order-card">

                <div class="order-header">

                    <div>

                        <div class="order-id">
                            Order ID:
                            ${escapeHTML(orderId)}
                        </div>

                        <div class="order-date">
                            ${escapeHTML(orderDate)}
                        </div>

                    </div>


                    <div class="status">

                        ${escapeHTML(
                            status
                                .charAt(0)
                                .toUpperCase() +
                            status.slice(1)
                        )}

                    </div>

                </div>


                <div class="customer">

                    <h3>
                        📦 Delivery Details
                    </h3>

                    <p>
                        <strong>
                            ${escapeHTML(
                                customer.name ||
                                'Customer'
                            )}
                        </strong>
                    </p>

                    <p>
                        📱 ${escapeHTML(
                            customer.phone ||
                            'N/A'
                        )}
                    </p>

                    <p>
                        📍 ${escapeHTML(
                            address ||
                            'Address not available'
                        )}
                    </p>

                </div>


                <div class="items">

                    <h3>
                        🛒 Ordered Products
                    </h3>

                    ${itemsHTML}

                </div>


                <div class="order-bottom">

                    <div class="payment">
                        💵 Cash on Delivery
                    </div>

                    <div class="total">
                        Total: ₹${money(total)}
                    </div>

                </div>

            </article>

        `;

    }


    // =====================================================
    // INITIALIZE
    // =====================================================

    document.addEventListener(
        'DOMContentLoaded',
        loadOrders
    );

</script>

</body>
  </html>
