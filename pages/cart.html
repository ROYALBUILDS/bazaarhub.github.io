<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - BazaarHub</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>
        .cart-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .cart-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .cart-items {
            background: white;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            padding: 2rem;
        }

        .cart-empty {
            text-align: center;
            padding: 3rem;
            color: #777;
        }

        .cart-empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid #E0E0E0;
            gap: 1.5rem;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-image {
            font-size: 3rem;
            min-width: 80px;
            text-align: center;
        }

        .item-image img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 8px;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #004E89;
        }

        .item-price {
            color: #FF6B35;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .item-total {
            margin-top: 0.4rem;
            color: #555;
            font-size: 0.95rem;
        }

        .item-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .quantity-btn {
            background: #F8F9FA;
            border: 1px solid #D5D5D5;
            width: 36px;
            height: 36px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 1.2rem;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .quantity-btn:hover {
            background: #004E89;
            color: white;
            border-color: #004E89;
        }

        .quantity-btn:active {
            transform: scale(0.94);
        }

        .quantity-input {
            width: 55px;
            height: 36px;
            text-align: center;
            border: 1px solid #D5D5D5;
            padding: 0.3rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
        }

        .quantity-input:focus {
            outline: none;
            border-color: #004E89;
        }

        .remove-btn {
            background: #DC2626;
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .remove-btn:hover {
            background: #B91C1C;
        }

        .cart-summary {
            background: white;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            padding: 2rem;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .summary-row.total {
            border-top: 2px solid #E0E0E0;
            padding-top: 1rem;
            font-size: 1.3rem;
            font-weight: 700;
            color: #FF6B35;
        }

        .checkout-btn {
            width: 100%;
            background: #FF6B35;
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1.5rem;
        }

        .checkout-btn:hover {
            background: #E55A1F;
        }

        .checkout-btn:disabled {
            background: #CCC;
            cursor: not-allowed;
        }

        .continue-shopping {
            text-align: center;
            margin-top: 1rem;
        }

        .continue-shopping a {
            color: #004E89;
            text-decoration: none;
            font-weight: 600;
        }

        .continue-shopping a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {

            .cart-container {
                padding: 0 1rem;
            }

            .cart-content {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: static;
            }

            .cart-item {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .item-details {
                width: 100%;
            }

            .item-controls {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="nav-container">

            <div class="nav-logo">
                <h1>🛍️ BazaarHub</h1>
            </div>

            <ul class="nav-menu">

                <li>
                    <a href="../index.html" class="nav-link">
                        Home
                    </a>
                </li>

                <li>
                    <a href="../index.html#products" class="nav-link">
                        Products
                    </a>
                </li>

                <li>
                    <a href="../index.html#about" class="nav-link">
                        About
                    </a>
                </li>

                <li>
                    <a href="../index.html#contact" class="nav-link">
                        Contact
                    </a>
                </li>

                <li>
                    <a href="login.html" class="nav-link">
                        Login
                    </a>
                </li>

                <li>
                    <a href="cart.html" class="cart-link">
                        🛒 Cart (<span id="cart-count">0</span>)
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <!-- Cart Section -->

    <div class="cart-container">

        <h2 style="margin-bottom: 2rem; color: #004E89;">
            Shopping Cart
        </h2>

        <div class="cart-content">

            <!-- Cart Items -->

            <div class="cart-items">

                <div id="cartItemsContainer">
                    <!-- Cart items loaded here -->
                </div>

            </div>


            <!-- Cart Summary -->

            <div class="cart-summary">

                <h3 style="margin-bottom: 1.5rem; color: #004E89;">
                    Order Summary
                </h3>

                <div class="summary-row">

                    <span>
                        Subtotal:
                    </span>

                    <span>
                        ₹<span id="subtotal">0</span>
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Shipping:
                    </span>

                    <span id="shipping">
                        Free
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Tax (5%):
                    </span>

                    <span>
                        ₹<span id="tax">0</span>
                    </span>

                </div>


                <div class="summary-row total">

                    <span>
                        Total:
                    </span>

                    <span>
                        ₹<span id="total">0</span>
                    </span>

                </div>


                <button
                    class="checkout-btn"
                    id="checkoutBtn"
                    onclick="proceedToCheckout()"
                >
                    Proceed to Checkout
                </button>


                <div class="continue-shopping">

                    <a href="../index.html">
                        ← Continue Shopping
                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- Footer -->

    <footer class="footer">

        <p>
            &copy; 2024 BazaarHub.
            All rights reserved.
            | Powered by ROYALBUILDS
        </p>

    </footer>


    <!-- Cart JavaScript -->

    <script src="../js/cart.js"></script>


    <script>

        // ================================
        // DISPLAY CART ITEMS
        // ================================

        function displayCartItems() {

            const cart = getCart();

            const container =
                document.getElementById('cartItemsContainer');

            const checkoutBtn =
                document.getElementById('checkoutBtn');


            // Empty cart

            if (!cart || cart.length === 0) {

                container.innerHTML = `

                    <div class="cart-empty">

                        <div class="cart-empty-icon">
                            🛒
                        </div>

                        <h3>
                            Your cart is empty
                        </h3>

                        <p>
                            Add some products to get started!
                        </p>

                    </div>

                `;

                checkoutBtn.disabled = true;

                updateOrderSummary();

                return;
            }


            // Enable checkout

            checkoutBtn.disabled = false;


            // Display products

            container.innerHTML = cart.map(item => {

                const productName =
                    item.title ||
                    item.name ||
                    'Product';


                const productImage =
                    item.image ||
                    '🛍️';


                const price =
                    Number(item.price) || 0;


                const quantity =
                    Number(item.quantity) || 1;


                const itemTotal =
                    price * quantity;


                return `

                    <div class="cart-item">

                        <div class="item-image">

                            ${
                                typeof productImage === 'string' &&
                                (
                                    productImage.startsWith('http') ||
                                    productImage.startsWith('/') ||
                                    productImage.startsWith('./') ||
                                    productImage.startsWith('../')
                                )

                                ?

                                `
                                    <img
                                        src="${productImage}"
                                        alt="${productName}"
                                    >
                                `

                                :

                                productImage
                            }

                        </div>


                        <div class="item-details">

                            <div class="item-name">
                                ${productName}
                            </div>

                            <div class="item-price">
                                ₹${price.toLocaleString('en-IN')}
                            </div>

                            <div class="item-total">
                                Item Total:
                                <strong>
                                    ₹${itemTotal.toLocaleString('en-IN')}
                                </strong>
                            </div>

                        </div>


                        <div class="item-controls">

                            <button
                                class="quantity-btn"
                                type="button"
                                onclick="
                                    changeCartQuantity(
                                        ${Number(item.id)},
                                        -1
                                    )
                                "
                            >
                                −
                            </button>


                            <input
                                type="number"
                                class="quantity-input"
                                value="${quantity}"
                                min="1"
                                onchange="
                                    changeCartQuantity(
                                        ${Number(item.id)},
                                        this.value,
                                        true
                                    )
                                "
                            >


                            <button
                                class="quantity-btn"
                                type="button"
                                onclick="
                                    changeCartQuantity(
                                        ${Number(item.id)},
                                        1
                                    )
                                "
                            >
                                +
                            </button>


                            <button
                                class="remove-btn"
                                type="button"
                                onclick="
                                    removeCartItem(
                                        ${Number(item.id)}
                                    )
                                "
                            >
                                Remove
                            </button>

                        </div>

                    </div>

                `;

            }).join('');


            updateOrderSummary();

        }


        // ================================
        // CHANGE QUANTITY
        // ================================

        function changeCartQuantity(
            productId,
            value,
            directValue = false
        ) {

            const cart = getCart();

            const item =
                cart.find(
                    item =>
                        Number(item.id) ===
                        Number(productId)
                );


            if (!item) {
                return;
            }


            let newQuantity;


            if (directValue) {

                newQuantity =
                    parseInt(value);

            } else {

                newQuantity =
                    Number(item.quantity) +
                    Number(value);

            }


            // Minimum quantity = 1

            if (!Number.isFinite(newQuantity) ||
                newQuantity < 1) {

                newQuantity = 1;

            }


            item.quantity = newQuantity;


            saveCart(cart);


            // IMPORTANT:
            // Re-render cart immediately

            displayCartItems();

            updateCartCount();

        }


        // ================================
        // REMOVE ITEM
        // ================================

        function removeCartItem(productId) {

            let cart = getCart();

            cart =
                cart.filter(
                    item =>
                        Number(item.id) !==
                        Number(productId)
                );


            saveCart(cart);


            displayCartItems();

            updateCartCount();

        }


        // ================================
        // UPDATE ORDER SUMMARY
        // ================================

        function updateOrderSummary() {

            const cart = getCart();


            const subtotal =
                cart.reduce(
                    (total, item) => {

                        const price =
                            Number(item.price) || 0;

                        const quantity =
                            Number(item.quantity) || 1;

                        return total +
                            (price * quantity);

                    },
                    0
                );


            const tax =
                Math.round(subtotal * 0.05);


            const grandTotal =
                subtotal + tax;


            document.getElementById(
                'subtotal'
            ).textContent =
                subtotal.toLocaleString('en-IN');


            document.getElementById(
                'tax'
            ).textContent =
                tax.toLocaleString('en-IN');


            document.getElementById(
                'total'
            ).textContent =
                grandTotal.toLocaleString('en-IN');

        }


        // ================================
        // PROCEED TO CHECKOUT
        // ================================

        function proceedToCheckout() {

            const cart = getCart();


            if (!cart || cart.length === 0) {

                alert(
                    'Your cart is empty!'
                );

                return;

            }


            window.location.href =
                'checkout.html';

        }


        // ================================
        // INITIALIZE
        // ================================

        document.addEventListener(
            'DOMContentLoaded',
            function () {

                displayCartItems();

                updateCartCount();

            }
        );

    </script>

</body>
    </html>
